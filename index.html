<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Smartphone Mockup</title>
</head>
<body>
  <div class="smartphone">
      <!-- Hardware Notch -->
      <div class="notch"><div class="speaker"></div><div class="camera"></div></div>

      <!-- Master Screen UI -->
      <div class="screen">
          <!-- Global Status Bar -->
          <div class="status-bar" id="status-bar">
              <span id="clock">12:00</span>
              <span>📶 🔋</span>
          </div>

          <!-- Home Screen Apps -->
          <div class="app-grid" id="home-grid">
              <div class="app-icon" onclick="openApp('dialer-app', true)">
                  <div class="icon-shape phone-bg">📞</div>
                  <div class="app-label">Phone</div>
              </div>
              <div class="app-icon" onclick="openApp('store-app', true)">
                  <div class="icon-shape store-bg">A</div>
                  <div class="app-label">App Store</div>
              </div>
          </div>

          <!-- Working Dialer Window -->
          <div id="dialer-app" class="app-window" style="background:#fff;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="font-weight:700">Phone</div>
                <div style="font-size:14px;cursor:pointer;color:#007aff" onclick="goHome()">Close</div>
              </div>
              <div class="dial-display" id="dial-screen"></div>
              <div class="keypad">
                  <div class="key" onclick="pressKey('1')">1</div>
                  <div class="key" onclick="pressKey('2')">2</div>
                  <div class="key" onclick="pressKey('3')">3</div>
                  <div class="key" onclick="pressKey('4')">4</div>
                  <div class="key" onclick="pressKey('5')">5</div>
                  <div class="key" onclick="pressKey('6')">6</div>
                  <div class="key" onclick="pressKey('7')">7</div>
                  <div class="key" onclick="pressKey('8')">8</div>
                  <div class="key" onclick="pressKey('9')">9</div>
                  <div class="key" onclick="pressKey('*')">*</div>
                  <div class="key" onclick="pressKey('0')">0</div>
                  <div class="key" onclick="pressKey('#')">#</div>
              </div>
              <div class="dial-actions">
                  <div style="width: 40px;"></div> <!-- Spacer -->
                  <div class="call-btn" onclick="makeCall()">📞</div>
                  <div class="backspace-btn" onclick="pressBackspace()">⌫</div>
              </div>
          </div>

          <!-- Working App Store Window -->
          <div id="store-app" class="app-window" style="background:#f2f2f7;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="store-header">Apps</div>
                <div style="font-size:14px;cursor:pointer;color:#007aff" onclick="goHome()">Close</div>
              </div>

              <div id="store-list">
                <div class="store-item">
                  <div class="store-item-info">
                    <div class="store-icon" style="background:#111;color:white;border-radius:10px">🎮</div>
                    <div>
                      <div class="store-name">Snake</div>
                      <div style="font-size:12px;color:#666">Classic arcade snake</div>
                    </div>
                  </div>
                  <button id="btn-snake" class="get-btn" onclick="installApp('snake','🎮','Snake','#111')">GET</button>
                </div>

                <div class="store-item">
                  <div class="store-item-info">
                    <div class="store-icon" style="background:#ffcc00">🎨</div>
                    <div>
                      <div class="store-name">Paint Mobile</div>
                      <div style="font-size:12px;color:#666">Simple drawing canvas</div>
                    </div>
                  </div>
                  <button id="btn-paint" class="get-btn" onclick="installApp('paint','🎨','Paint Mobile','#ffffff')">GET</button>
                </div>
              </div>
          </div>

          <!-- Snake App Window -->
          <div id="app-snake" class="app-window" style="background:#000;color:#fff;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-weight:700">Snake</div>
              <div style="display:flex;gap:8px;align-items:center;">
                <button class="small-btn" onclick="startSnake()">Start</button>
                <button class="small-btn" onclick="stopSnake()">Stop</button>
                <div style="font-size:14px;cursor:pointer;color:#fff" onclick="goHome()">Home</div>
              </div>
            </div>
            <div class="app-content center" style="padding-top:8px;">
              <canvas id="snakeCanvas" class="snake-canvas" width="320" height="320"></canvas>
              <div style="color:#fff;margin-top:8px">Use arrow keys to control the snake.</div>
            </div>
          </div>

          <!-- Paint App Window -->
          <div id="app-paint" class="app-window" style="background:#fff;color:#000;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-weight:700">Paint</div>
              <div style="display:flex;gap:8px;align-items:center;">
                <button class="small-btn" onclick="clearCanvas()">Clear</button>
                <div style="font-size:14px;cursor:pointer;color:#007aff" onclick="goHome()">Home</div>
              </div>
            </div>
            <div class="app-content center" style="padding-top:8px;">
              <canvas id="paintCanvas" width="320" height="460"></canvas>
            </div>
          </div>

          <!-- Bottom Home Bar -->
          <div class="home-bar-container" onclick="goHome()">
              <div class="home-bar"></div>
          </div>
      </div>
  </div>

  <script>
    // System Clock Logic
    function updateClock() {
      const now = new Date();
      let hr = now.getHours();
      let min = now.getMinutes();
      const hh = hr < 10 ? '0' + hr : hr;
      const mm = min < 10 ? '0' + min : min;
      document.getElementById('clock').textContent = hh + ':' + mm;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Core Navigation Architecture
    function openApp(appId, isLightThemeApp) {
      // hide home grid
      document.getElementById('home-grid').style.display = 'none';
      document.querySelectorAll('.app-window').forEach(win => win.classList.remove('active'));
      const win = document.getElementById(appId);
      if (!win) return;
      win.classList.add('active');

      const statusBar = document.getElementById('status-bar');
      const homeBarContainer = document.querySelector('.home-bar-container');
      // isLightThemeApp true => app uses light background -> dark status bar text
      if (isLightThemeApp) {
        statusBar.style.color = '#000';
        homeBarContainer.classList.add('dark-home-bar');
      } else {
        statusBar.style.color = '#fff';
        homeBarContainer.classList.remove('dark-home-bar');
      }
    }

    function goHome() {
      document.querySelectorAll('.app-window').forEach(win => win.classList.remove('active'));
      document.getElementById('status-bar').style.color = '#fff';
      document.querySelector('.home-bar-container').classList.remove('dark-home-bar');
      document.getElementById('home-grid').style.display = 'grid';
    }

    // Dialer Mechanics
    let dialString = "";
    function pressKey(num) {
      dialString += num;
      document.getElementById('dial-screen').textContent = dialString;
    }
    function pressBackspace() {
      dialString = dialString.slice(0, -1);
      document.getElementById('dial-screen').textContent = dialString;
    }
    function makeCall() {
      if (dialString.length > 0) {
        alert("Calling: " + dialString);
      } else {
        alert("Enter a number first.");
      }
    }

    // App Store Deployment Engine
    const installedRegistry = {};

    function installApp(id, icon, label, bg) {
      if (installedRegistry[id]) {
        // if already installed, open it
        openApp('app-' + id, id === 'paint'); // paint uses light background
        return;
      }
      const btn = document.getElementById(`btn-${id}`);
      if (!btn) return;
      btn.innerText = "LOADING...";
      btn.disabled = true;
      setTimeout(() => {
        btn.innerText = "OPEN";
        btn.classList.add('installed');
        btn.disabled = false;
        // set button to open the installed app
        btn.onclick = () => openApp('app-' + id, id === 'paint');

        // Add icon to home-grid
        const grid = document.getElementById('home-grid');
        const newApp = document.createElement('div');
        newApp.className = "app-icon";
        newApp.onclick = () => openApp('app-' + id, id === 'paint');
        newApp.innerHTML = `
          <div class="icon-shape" style="background:${bg};">${icon}</div>
          <div class="app-label">${label}</div>
        `;
        grid.appendChild(newApp);

        installedRegistry[id] = true;
        // Auto-open after install (optional): openApp('app-' + id, id === 'paint');
        alert(label + " installed!");
      }, 900);
    }

    // Paint App Implementation
    (function setupPaint() {
      const canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;
      let lastX = 0, lastY = 0;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';

      function start(e) {
        drawing = true;
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        lastX = x; lastY = y;
      }
      function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x; lastY = y;
      }
      function stop() { drawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('touchmove', draw, {passive:false});
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('mouseout', stop);
      canvas.addEventListener('touchend', stop);

      window.clearCanvas = function() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      };
    })();

    // Simple Snake Game
    (function setupSnake() {
      const canvas = document.getElementById('snakeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const tileSize = 16;
      const cols = Math.floor(canvas.width / tileSize);
      const rows = Math.floor(canvas.height / tileSize);
      let snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
      let dir = {x:1,y:0};
      let apple = randomApple();
      let running = false;
      let loopId = null;
      let speed = 120; // ms

      function randomApple() {
        return {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
      }

      function draw() {
        // background
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // apple
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(apple.x * tileSize, apple.y * tileSize, tileSize, tileSize);

        // snake
        ctx.fillStyle = '#7ed957';
        for (let s of snake) {
          ctx.fillRect(s.x * tileSize, s.y * tileSize, tileSize-1, tileSize-1);
        }
      }

      function step() {
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        // wrap around
        if (head.x < 0) head.x = cols - 1;
        if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows - 1;
        if (head.y >= rows) head.y = 0;

        // collision with self
        for (let s of snake) {
          if (s.x === head.x && s.y === head.y) {
            stopSnake();
            alert('Game over! Score: ' + (snake.length - 1));
            snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
            dir = {x:1,y:0};
            apple = randomApple();
            return;
          }
        }

        snake.unshift(head);

        // ate apple?
        if (head.x === apple.x && head.y === apple.y) {
          apple = randomApple();
        } else {
          snake.pop();
        }
      }

      function loop() {
        step();
        draw();
        if (running) loopId = setTimeout(loop, speed);
      }

      window.startSnake = function() {
        if (!running) {
          running = true;
          if (loopId) clearTimeout(loopId);
          loop();
        }
      };
      window.stopSnake = function() {
        running = false;
        if (loopId) clearTimeout(loopId);
        loopId = null;
      };

      // arrow keys
      window.addEventListener('keydown', (e) => {
        if (!document.getElementById('app-snake').classList.contains('active')) return;
        if (e.key === 'ArrowUp' && dir.y !== 1) dir = {x:0,y:-1};
        if (e.key === 'ArrowDown' && dir.y !== -1) dir = {x:0,y:1};
        if (e.key === 'ArrowLeft' && dir.x !== 1) dir = {x:-1,y:0};
        if (e.key === 'ArrowRight' && dir.x !== -1) dir = {x:1,y:0};
      });

      // draw initial
      draw();
    })();

    // Initialize: go home (ensure home visible)
    goHome();
  </script>
  <script src="script.js"></script>
</body>
</html>
