<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Smartphone Mockup</title>
  <style>
    /* Page + phone frame */
    :root {
      --phone-width: 360px;
      --phone-height: 740px;
    }
    body {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      background: radial-gradient(circle at 10% 10%, #f6f9ff, #e9eef7 35%, #dfe7f1 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Phone shell */
    .phone {
      width: var(--phone-width);
      height: var(--phone-height);
      border-radius: 42px;
      background: linear-gradient(180deg,#0d0f12 0%, #0b0c0e 100%);
      padding: 12px;
      box-sizing: border-box;
      box-shadow:
        0 30px 60px rgba(10,20,40,0.25),
        inset 0 2px 0 rgba(255,255,255,0.03);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Screen area */
    .screen {
      width:100%;
      height:100%;
      border-radius: 36px;
      overflow:hidden;
      background: linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
      position:relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      display:flex;
      flex-direction:column;
      color:#fff;
    }

    /* Notch */
    .notch {
      width: 140px;
      height: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 16px;
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:40;
    }
    .notch .speaker {
      width:54px;height:6px;background:#2a2a2a;border-radius:4px;
    }

    /* Status bar */
    .status {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 18px 18px 0 18px;
      z-index:30;
      font-weight:600;
      font-size:14px;
    }

    /* Home (wallpaper + apps) */
    .home {
      padding: 70px 18px 90px 18px;
      display:flex;
      flex-direction:column;
      gap:8px;
      height:100%;
      box-sizing:border-box;
    }

    .wallpaper {
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .app-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-top:6px;
    }

    .app {
      text-align:center;
      cursor:pointer;
    }
    .icon {
      width:58px;height:58px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 16px rgba(0,0,0,0.2);
    }
    .label {
      margin-top:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.95);text-shadow:0 1px 2px rgba(0,0,0,0.5)
    }

    /* Phone and store colors */
    .icon.phone { background:#4cd964; color:#063a06; }
    .icon.store { background:#007aff; color:#fff; font-weight:800; font-size:22px; }
    .icon.paint { background:#ffcc00; color:#5b2f00; }
    .icon.snake { background:#111; color:#fff; }

    /* App windows */
    .app-window {
      position:absolute;
      inset:0;
      background:#fff;
      color:#000;
      display:none;
      flex-direction:column;
      box-sizing:border-box;
      padding:64px 18px 90px 18px;
      z-index:45;
      overflow:auto;
    }
    .app-window.light { color:#000; background:#fff; }
    .app-window.dark { color:#fff; background:#0b0b0b; }

    .app-window.active { display:flex; }

    /* Dialer */
    .dial-display { font-size:32px; text-align:center; margin:20px 0 6px 0; min-height:42px; letter-spacing:1px; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; justify-items:center; margin-top:10px; }
    .key { width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaeef6; font-size:22px;cursor:pointer; user-select:none; }
    .call-row { display:flex; justify-content:center; gap:28px; align-items:center; margin-top:18px; }
    .call-btn { width:66px;height:66px;border-radius:50%;background:#4cd964;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px; cursor:pointer; }

    /* App store list */
    .store-list { display:flex;flex-direction:column; gap:12px; margin-top:6px; }
    .store-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border-radius:12px; background:rgba(255,255,255,0.95); box-shadow:0 6px 14px rgba(0,0,0,0.08); }
    .store-left { display:flex; gap:12px; align-items:center; }
    .get-btn { padding:8px 12px; background:#007aff; color:#fff; border-radius:12px; border:0; cursor:pointer; font-weight:700; }
    .get-btn.installed { background:#e6e7eb; color:#007aff; font-weight:700; }

    /* Home indicator */
    .home-indicator {
      position:absolute;
      bottom:16px;
      left:50%;
      transform:translateX(-50%);
      width:110px;height:6px;border-radius:12px;background:rgba(255,255,255,0.8);
      z-index:60;
      cursor:pointer;
    }

    /* App header */
    .app-header { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:18px; margin-bottom:8px; }

    /* Paint */
    .paint-canvas { width:100%; border-radius:12px; background:white; touch-action:none; }

    /* Snake */
    .snake-canvas { background:#000; border-radius:8px; }

    /* small button */
    .btn { padding:8px 10px; border-radius:10px; border:0; background:#007aff; color:white; font-weight:700; cursor:pointer; }

    /* subtle footer text on home */
    .footer { text-align:center; font-size:12px; color:rgba(255,255,255,0.85); margin-top:12px; }
  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="Smartphone mockup">
    <div class="screen" id="screen">
      <div class="notch"><div class="speaker" aria-hidden="true"></div></div>

      <div class="status">
        <div id="clock">12:00</div>
        <div>📶 🔋</div>
      </div>

      <div class="home" id="home">
        <div class="wallpaper">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:800;font-size:20px">My Phone</div>
            <div style="font-size:13px;opacity:0.95">Today</div>
          </div>

          <div class="app-grid" id="home-grid">
            <div class="app" onclick="openApp('dialer', true)">
              <div class="icon phone">📞</div>
              <div class="label">Phone</div>
            </div>

            <div class="app" onclick="openApp('store', true)">
              <div class="icon store">A</div>
              <div class="label">App Store</div>
            </div>

            <!-- placeholder slots -->
            <div class="app" id="slot-1" style="visibility:hidden"><div class="icon" style="background:#ddd"></div><div class="label">.</div></div>
            <div class="app" id="slot-2" style="visibility:hidden"><div class="icon" style="background:#ddd"></div><div class="label">.</div></div>
          </div>

          <div class="footer">Swipe up for more (click the bar)</div>
        </div>
      </div>

      <!-- App: Dialer -->
      <div id="dialer" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>Phone</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>

        <div class="dial-display" id="dialDisplay"></div>
        <div class="keypad" id="keypad">
          <div class="key" onclick="pressKey('1')">1</div>
          <div class="key" onclick="pressKey('2')">2</div>
          <div class="key" onclick="pressKey('3')">3</div>
          <div class="key" onclick="pressKey('4')">4</div>
          <div class="key" onclick="pressKey('5')">5</div>
          <div class="key" onclick="pressKey('6')">6</div>
          <div class="key" onclick="pressKey('7')">7</div>
          <div class="key" onclick="pressKey('8')">8</div>
          <div class="key" onclick="pressKey('9')">9</div>
          <div class="key" onclick="pressKey('*')">*</div>
          <div class="key" onclick="pressKey('0')">0</div>
          <div class="key" onclick="pressKey('#')">#</div>
        </div>
        <div class="call-row">
          <div style="width:40px"></div>
          <div class="call-btn" onclick="makeCall()">📞</div>
          <div style="width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="backspace()">⌫</div>
        </div>
      </div>

      <!-- App: App Store -->
      <div id="store" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>App Store</div>
          <div><button class="btn" onclick="goHome()">Home</button></div>
        </div>

        <div class="store-list">
          <div class="store-item">
            <div class="store-left">
              <div class="icon snake" style="width:45px;height:45px;border-radius:10px;display:flex;align-items:center;justify-content:center">🎮</div>
              <div>
                <div style="font-weight:800">Snake</div>
                <div style="font-size:12px;color:#666">Classic arcade game</div>
              </div>
            </div>
            <div>
              <button id="btn-snake" class="get-btn" onclick="installApp('snake','🎮','Snake','#111')">GET</button>
            </div>
          </div>

          <div class="store-item">
            <div class="store-left">
              <div class="icon paint" style="width:45px;height:45px;border-radius:10px;display:flex;align-items:center;justify-content:center">🎨</div>
              <div>
                <div style="font-weight:800">Paint</div>
                <div style="font-size:12px;color:#666">Simple drawing canvas</div>
              </div>
            </div>
            <div>
              <button id="btn-paint" class="get-btn" onclick="installApp('paint','🎨','Paint','#ffcc00')">GET</button>
            </div>
          </div>
        </div>
      </div>

      <!-- App Window: Snake -->
      <div id="app-snake" class="app-window dark" aria-hidden="true">
        <div class="app-header">
          <div>Snake</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="stopSnake()">Stop</button>
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>
        <div style="display:flex;justify-content:center;align-items:center;flex-direction:column;gap:8px">
          <canvas id="snakeCanvas" class="snake-canvas" width="320" height="320"></canvas>
          <div style="color:#fff">Use arrow keys to play</div>
        </div>
      </div>

      <!-- App Window: Paint -->
      <div id="app-paint" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>Paint</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="clearPaint()">Clear</button>
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>

        <div style="padding-top:8px;">
          <canvas id="paintCanvas" class="paint-canvas" width="320" height="420"></canvas>
        </div>
      </div>

      <div class="home-indicator" onclick="goHome()" title="Home"></div>
    </div>
  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('clock').textContent = hh + ':' + mm;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Navigation
    function openApp(id, lightTheme = true) {
      // hide home grid
      document.getElementById('home-grid').style.display = 'grid';
      document.querySelectorAll('.app-window').forEach(w => {
        w.classList.remove('active');
        w.setAttribute('aria-hidden','true');
      });
      const win = document.getElementById(id);
      if (!win) return;
      win.classList.add('active');
      win.setAttribute('aria-hidden','false');

      // For visual: hide home area
      document.getElementById('home').style.display = 'none';
      // status bar color
      document.querySelector('.status').style.color = lightTheme ? '#000' : '#fff';
      // adjust home-indicator color for dark windows
      document.querySelector('.home-indicator').style.background = lightTheme ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.85)';
    }

    function goHome() {
      document.getElementById('home').style.display = 'block';
      document.querySelectorAll('.app-window').forEach(w => {
        w.classList.remove('active');
        w.setAttribute('aria-hidden','true');
      });
      document.querySelector('.status').style.color = '#fff';
      document.querySelector('.home-indicator').style.background = 'rgba(255,255,255,0.8)';
    }

    // Dialer logic
    let dial = '';
    function pressKey(k) {
      dial += k;
      document.getElementById('dialDisplay').textContent = dial;
    }
    function backspace() {
      dial = dial.slice(0,-1);
      document.getElementById('dialDisplay').textContent = dial;
    }
    function makeCall() {
      if (!dial) { alert('Enter a number'); return; }
      alert('Calling ' + dial);
    }

    // App installation flow
    const installed = {};
    function installApp(id, icon, label, bg) {
      if (installed[id]) {
        // open existing
        openApp('app-' + id, id === 'paint');
        return;
      }
      const btn = document.getElementById('btn-' + id);
      if (!btn) return;
      btn.textContent = 'LOADING...';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'OPEN';
        btn.classList.add('installed');
        btn.disabled = false;
        btn.onclick = () => openApp('app-' + id, id === 'paint');

        // add icon to home grid
        const grid = document.getElementById('home-grid');
        const appEl = document.createElement('div');
        appEl.className = 'app';
        appEl.onclick = () => openApp('app-' + id, id === 'paint');
        appEl.innerHTML = `<div class="icon" style="background:${bg};">${icon}</div><div class="label">${label}</div>`;
        grid.appendChild(appEl);

        installed[id] = true;
        alert(label + ' installed');
      }, 800);
    }

    // Paint app
    (function() {
      const canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';
      let drawing = false;
      let lastX = 0, lastY = 0;

      function pos(e) {
        const r = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return {x,y};
      }
      function start(e) {
        drawing = true;
        const p = pos(e);
        lastX = p.x; lastY = p.y;
      }
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX,lastY);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
      }
      function end() { drawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('touchmove', move, {passive:false});
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchend', end);

      window.clearPaint = function() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      };
      window.clearPaint(); // start blank
    })();

    // Simple Snake
    (function() {
      const canvas = document.getElementById('snakeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const tile = 16;
      const cols = Math.floor(canvas.width / tile);
      const rows = Math.floor(canvas.height / tile);
      let snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
      let dir = {x:1,y:0};
      let apple = spawnApple();
      let running = false;
      let timer = null;
      const speed = 120;

      function spawnApple() {
        return { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      }

      function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // apple
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(apple.x*tile, apple.y*tile, tile, tile);

        // snake
        ctx.fillStyle = '#7ed957';
        snake.forEach((s,i) => {
          ctx.fillRect(s.x*tile, s.y*tile, tile-1, tile-1);
        });
      }

      function step() {
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // wrap
        if (head.x < 0) head.x = cols-1;
        if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows-1;
        if (head.y >= rows) head.y = 0;

        // collision
        for (let s of snake) {
          if (s.x === head.x && s.y === head.y) {
            stopSnake();
            alert('Game over! Score: ' + (snake.length-1));
            snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
            dir = {x:1,y:0};
            apple = spawnApple();
            return;
          }
        }
        snake.unshift(head);

        // eat?
        if (head.x === apple.x && head.y === apple.y) {
          apple = spawnApple();
        } else {
          snake.pop();
        }
      }

      function loop() {
        step();
        draw();
        if (running) timer = setTimeout(loop, speed);
      }

      window.startSnake = function() {
        if (!running) {
          running = true;
          loop();
        }
      };
      window.stopSnake = function() {
        running = false;
        if (timer) clearTimeout(timer);
        timer = null;
      };

      window.addEventListener('keydown', function(e) {
        // only respond when snake app active
        if (!document.getElementById('app-snake').classList.contains('active')) return;
        if (e.key === 'ArrowUp' && dir.y !== 1) dir = {x:0,y:-1};
        if (e.key === 'ArrowDown' && dir.y !== -1) dir = {x:0,y:1};
        if (e.key === 'ArrowLeft' && dir.x !== 1) dir = {x:-1,y:0};
        if (e.key === 'ArrowRight' && dir.x !== -1) dir = {x:1,y:0};
      });

      draw();
    })();

    // start on home
    goHome();
  </script>
</body>
</html>
