<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Smartphone Mockup — Full App Store</title>
  <style>
    /* Page + phone frame */
    :root {
      --phone-width: 360px;
      --phone-height: 740px;
    }
    body {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      background: radial-gradient(circle at 10% 10%, #f6f9ff, #e9eef7 35%, #dfe7f1 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Phone shell */
    .phone {
      width: var(--phone-width);
      height: var(--phone-height);
      border-radius: 42px;
      background: linear-gradient(180deg,#0d0f12 0%, #0b0c0e 100%);
      padding: 12px;
      box-sizing: border-box;
      box-shadow:
        0 30px 60px rgba(10,20,40,0.25),
        inset 0 2px 0 rgba(255,255,255,0.03);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Screen area */
    .screen {
      width:100%;
      height:100%;
      border-radius: 36px;
      overflow:hidden;
      background: linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
      position:relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      display:flex;
      flex-direction:column;
      color:#fff;
    }

    /* Notch */
    .notch {
      width: 140px;
      height: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 16px;
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:40;
    }
    .notch .speaker {
      width:54px;height:6px;background:#2a2a2a;border-radius:4px;
    }

    /* Status bar */
    .status {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 18px 18px 0 18px;
      z-index:30;
      font-weight:600;
      font-size:14px;
    }

    /* Home (wallpaper + apps) */
    .home {
      padding: 70px 18px 90px 18px;
      display:flex;
      flex-direction:column;
      gap:8px;
      height:100%;
      box-sizing:border-box;
    }

    .wallpaper {
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .app-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-top:6px;
    }

    .app {
      text-align:center;
      cursor:pointer;
    }
    .icon {
      width:58px;height:58px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 16px rgba(0,0,0,0.2);
    }
    .label {
      margin-top:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.95);text-shadow:0 1px 2px rgba(0,0,0,0.5)
    }

    /* Phone and store colors */
    .icon.phone { background:#4cd964; color:#063a06; }
    .icon.store { background:#007aff; color:#fff; font-weight:800; font-size:22px; }
    .icon.paint { background:#ffcc00; color:#5b2f00; }
    .icon.snake { background:#111; color:#fff; }

    /* App windows */
    .app-window {
      position:absolute;
      inset:0;
      background:#fff;
      color:#000;
      display:none;
      flex-direction:column;
      box-sizing:border-box;
      padding:64px 18px 90px 18px;
      z-index:45;
      overflow:auto;
    }
    .app-window.light { color:#000; background:#fff; }
    .app-window.dark { color:#fff; background:#0b0b0b; }

    .app-window.active { display:flex; }

    /* Dialer */
    .dial-display { font-size:32px; text-align:center; margin:20px 0 6px 0; min-height:42px; letter-spacing:1px; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; justify-items:center; margin-top:10px; }
    .key { width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaeef6; font-size:22px;cursor:pointer; user-select:none; }
    .call-row { display:flex; justify-content:center; gap:28px; align-items:center; margin-top:18px; }
    .call-btn { width:66px;height:66px;border-radius:50%;background:#4cd964;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px; cursor:pointer; }

    /* App store full UI */
    .store-top {
      display:flex;
      gap:8px;
      align-items:center;
      margin-bottom:8px;
    }
    .search {
      flex:1;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .search input {
      flex:1;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e6e7eb;
      font-size:14px;
    }
    .categories { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .chip { padding:6px 10px; border-radius:999px; background:#f0f0f3; color:#111; font-weight:700; cursor:pointer; font-size:13px; }
    .chip.active { background:#007aff; color:#fff; }

    .store-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:6px; }

    .app-card {
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:10px;
      border-radius:10px;
      background:linear-gradient(180deg,#fff,#f7f7f9);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
    }
    .card-icon { width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px; }
    .card-body { flex:1; }
    .card-title { font-weight:800; margin-bottom:4px; }
    .card-desc { font-size:12px; color:#666; margin-bottom:8px; }

    .card-actions { display:flex; gap:8px; align-items:center; }

    .small-btn { padding:6px 8px; border-radius:8px; border:0; background:#007aff; color:#fff; cursor:pointer; font-weight:700; font-size:13px; }
    .small-btn.secondary { background:#e6e7eb; color:#111; }

    .load-more { margin-top:12px; display:flex; justify-content:center; }

    /* App detail overlay */
    .detail-overlay {
      position:fixed;
      inset:0;
      display:none;
      z-index:120;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.6);
    }
    .detail-card {
      width:320px;
      max-height:80vh;
      background:#fff;
      border-radius:12px;
      padding:16px;
      overflow:auto;
    }

    /* Home indicator */
    .home-indicator {
      position:absolute;
      bottom:16px;
      left:50%;
      transform:translateX(-50%);
      width:110px;height:6px;border-radius:12px;background:rgba(255,255,255,0.8);
      z-index:60;
      cursor:pointer;
    }

    /* small button */
    .btn { padding:8px 10px; border-radius:10px; border:0; background:#007aff; color:white; font-weight:700; cursor:pointer; }

    /* subtle footer text on home */
    .footer { text-align:center; font-size:12px; color:rgba(255,255,255,0.85); margin-top:12px; }
  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="Smartphone mockup">
    <div class="screen" id="screen">
      <div class="notch"><div class="speaker" aria-hidden="true"></div></div>

      <div class="status">
        <div id="clock">12:00</div>
        <div>📶 🔋</div>
      </div>

      <div class="home" id="home">
        <div class="wallpaper">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-weight:800;font-size:20px">My Phone</div>
            <div style="font-size:13px;opacity:0.95">Today</div>
          </div>

          <div class="app-grid" id="home-grid">
            <div class="app" onclick="openApp('dialer', true)">
              <div class="icon phone">📞</div>
              <div class="label">Phone</div>
            </div>

            <div class="app" onclick="openApp('store', true)">
              <div class="icon store">A</div>
              <div class="label">App Store</div>
            </div>
          </div>

          <div class="footer">Tap the Home bar or a Home button to return</div>
        </div>
      </div>

      <!-- App: Dialer -->
      <div id="dialer" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>Phone</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>

        <div class="dial-display" id="dialDisplay"></div>
        <div class="keypad" id="keypad">
          <div class="key" onclick="pressKey('1')">1</div>
          <div class="key" onclick="pressKey('2')">2</div>
          <div class="key" onclick="pressKey('3')">3</div>
          <div class="key" onclick="pressKey('4')">4</div>
          <div class="key" onclick="pressKey('5')">5</div>
          <div class="key" onclick="pressKey('6')">6</div>
          <div class="key" onclick="pressKey('7')">7</div>
          <div class="key" onclick="pressKey('8')">8</div>
          <div class="key" onclick="pressKey('9')">9</div>
          <div class="key" onclick="pressKey('*')">*</div>
          <div class="key" onclick="pressKey('0')">0</div>
          <div class="key" onclick="pressKey('#')">#</div>
        </div>
        <div class="call-row">
          <div style="width:40px"></div>
          <div class="call-btn" onclick="makeCall()">📞</div>
          <div style="width:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="backspace()">⌫</div>
        </div>
      </div>

      <!-- App: App Store (full) -->
      <div id="store" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>App Store</div>
          <div><button class="btn" onclick="goHome()">Home</button></div>
        </div>

        <div class="store-top">
          <div class="search">
            <input id="store-search" placeholder="Search apps..." oninput="renderStore()" />
            <button class="small-btn" onclick="resetStoreFilters()">Reset</button>
          </div>
        </div>

        <div class="categories" id="categories"></div>

        <div class="store-grid" id="store-grid"></div>

        <div class="load-more" id="load-more-container">
          <button class="small-btn" onclick="loadMore()">Load more</button>
        </div>
      </div>

      <!-- App Window: Snake -->
      <div id="app-snake" class="app-window dark" aria-hidden="true">
        <div class="app-header">
          <div>Snake</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="stopSnake()">Stop</button>
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>
        <div style="display:flex;justify-content:center;align-items:center;flex-direction:column;gap:8px">
          <canvas id="snakeCanvas" class="snake-canvas" width="320" height="320"></canvas>
          <div style="color:#fff">Use arrow keys to play</div>
        </div>
      </div>

      <!-- App Window: Paint -->
      <div id="app-paint" class="app-window light" aria-hidden="true">
        <div class="app-header">
          <div>Paint</div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="clearPaint()">Clear</button>
            <button class="btn" onclick="goHome()">Home</button>
          </div>
        </div>

        <div style="padding-top:8px;">
          <canvas id="paintCanvas" class="paint-canvas" width="320" height="420"></canvas>
        </div>
      </div>

      <!-- Generic app container for dynamically-created apps -->
      <div id="app-generic-container"></div>

      <!-- App Detail overlay -->
      <div id="detail-overlay" class="detail-overlay" onclick="hideDetail(event)">
        <div class="detail-card" id="detail-card" onclick="event.stopPropagation()">
          <!-- filled dynamically -->
        </div>
      </div>

      <div class="home-indicator" onclick="goHome()" title="Home"></div>
    </div>
  </div>

  <script>
    // --- System clock
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('clock').textContent = hh + ':' + mm;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Navigation helpers
    function openApp(id, lightTheme = true) {
      document.querySelectorAll('.app-window').forEach(w => {
        w.classList.remove('active');
        w.setAttribute('aria-hidden','true');
      });
      // show requested window
      const win = document.getElementById(id);
      if (!win) return;
      win.classList.add('active');
      win.setAttribute('aria-hidden','false');
      document.getElementById('home').style.display = 'none';
      document.querySelector('.status').style.color = lightTheme ? '#000' : '#fff';
      document.querySelector('.home-indicator').style.background = lightTheme ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.85)';
    }

    function goHome() {
      // hide all app windows
      document.querySelectorAll('.app-window').forEach(w => {
        w.classList.remove('active');
        w.setAttribute('aria-hidden','true');
      });
      // hide any generic apps
      const gen = document.getElementById('app-generic-container');
      gen.innerHTML = '';
      document.getElementById('home').style.display = 'block';
      document.querySelector('.status').style.color = '#fff';
      document.querySelector('.home-indicator').style.background = 'rgba(255,255,255,0.8)';
      // stop snake if active
      if (typeof stopSnake === 'function') stopSnake();
    }

    // --- Dialer
    let dial = '';
    function pressKey(k) {
      dial += k;
      document.getElementById('dialDisplay').textContent = dial;
    }
    function backspace() {
      dial = dial.slice(0,-1);
      document.getElementById('dialDisplay').textContent = dial;
    }
    function makeCall() {
      if (!dial) { alert('Enter a number'); return; }
      alert('Calling ' + dial);
    }

    // --- App store data & state
    const storeApps = [
      {id:'snake', icon:'🎮', name:'Snake', desc:'Classic arcade snake', bg:'#111', category:'Games', hasWindow:true},
      {id:'paint', icon:'🎨', name:'Paint', desc:'Simple drawing canvas', bg:'#ffcc00', category:'Creativity', hasWindow:true},
      {id:'notes', icon:'📝', name:'Notes', desc:'Quick note-taking', bg:'#ffa500', category:'Productivity'},
      {id:'weather', icon:'☀️', name:'Weather', desc:'Local weather & forecast', bg:'#2bb3ff', category:'Utilities'},
      {id:'music', icon:'🎵', name:'Music', desc:'Stream demo songs', bg:'#6a0dad', category:'Entertainment'},
      {id:'puzzle', icon:'🧩', name:'Puzzle Fun', desc:'Relaxing puzzles', bg:'#ff6b6b', category:'Games'},
      {id:'timer', icon:'⏱️', name:'Timer', desc:'Multiple timers', bg:'#33cc99', category:'Utilities'},
      {id:'todo', icon:'✅', name:'To-Do', desc:'Tasks & reminders', bg:'#007aff', category:'Productivity'},
      {id:'maps', icon:'🗺️', name:'Maps', desc:'Mini map demo', bg:'#00a86b', category:'Travel'},
      {id:'camera', icon:'📷', name:'Camera', desc:'Mock camera app', bg:'#ff7f50', category:'Photography'},
      {id:'calc', icon:'🧮', name:'Calculator', desc:'Basic calculations', bg:'#8b8bff', category:'Utilities'},
      {id:'chat', icon:'💬', name:'Chat', desc:'Local mock messaging', bg:'#ff5c8a', category:'Social'},
      {id:'photo-edit', icon:'🖼️', name:'Photo Edit', desc:'Simple photo filters', bg:'#c0a0ff', category:'Photography'},
      {id:'recipes', icon:'🍲', name:'Recipes', desc:'Recipe browser', bg:'#f7c948', category:'Lifestyle'},
      {id:'fitness', icon:'🏃', name:'Fitness', desc:'Short workouts', bg:'#4caf50', category:'Health'},
      {id:'calendar', icon:'📅', name:'Calendar', desc:'Event reminders', bg:'#ff8c42', category:'Productivity'},
      {id:'stocks', icon:'📈', name:'Stocks', desc:'Market overview', bg:'#3b82f6', category:'Finance'},
      {id:'radio', icon:'📻', name:'Radio', desc:'Internet radio demo', bg:'#2b2b2b', category:'Entertainment'},
      {id:'drawing', icon:'✏️', name:'Sketch', desc:'Quick sketches', bg:'#ffd166', category:'Creativity'},
      {id:'sleep', icon:'🌙', name:'Sleep Aid', desc:'Relaxing sounds', bg:'#7185ff', category:'Health'},
    ];
    let installed = {}; // id -> true
    let storeFilter = {search:'', category:'All', page:1, pageSize:6};

    // --- Store UI rendering
    function getCategories() {
      const cats = new Set(['All']);
      storeApps.forEach(a => cats.add(a.category));
      return Array.from(cats);
    }

    function renderCategories() {
      const box = document.getElementById('categories');
      box.innerHTML = '';
      getCategories().forEach(cat => {
        const el = document.createElement('div');
        el.className = 'chip' + (storeFilter.category === cat ? ' active' : '');
        el.textContent = cat;
        el.onclick = () => { storeFilter.category = (storeFilter.category === cat ? 'All' : cat); storeFilter.page = 1; renderStore(); };
        box.appendChild(el);
      });
    }

    function filteredApps() {
      const q = document.getElementById('store-search').value.trim().toLowerCase();
      return storeApps.filter(a => {
        if (storeFilter.category !== 'All' && a.category !== storeFilter.category) return false;
        if (q && !(a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q))) return false;
        return true;
      });
    }

    function renderStore() {
      renderCategories();
      const grid = document.getElementById('store-grid');
      grid.innerHTML = '';
      const list = filteredApps();
      const start = 0;
      const page = storeFilter.page || 1;
      const pageSize = storeFilter.pageSize;
      const visible = list.slice(0, page * pageSize);
      visible.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.innerHTML = `
          <div class="card-icon" style="background:${app.bg}; color:${getContrastText(app.bg)}">${app.icon}</div>
          <div class="card-body">
            <div class="card-title">${app.name}</div>
            <div class="card-desc">${app.desc}</div>
            <div style="display:flex;gap:8px;">
              <button class="small-btn" onclick="openDetail('${app.id}')">Details</button>
              <div class="card-actions" id="actions-${app.id}"></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
        renderAppActions(app);
      });
      // load more visibility
      const loadMore = document.getElementById('load-more-container');
      if (visible.length < list.length) loadMore.style.display = 'flex'; else loadMore.style.display = 'none';
    }

    function renderAppActions(app) {
      const container = document.getElementById('actions-' + app.id);
      container.innerHTML = '';
      const btn = document.createElement('button');
      if (installed[app.id]) {
        btn.className = 'small-btn secondary';
        btn.textContent = 'OPEN';
        btn.onclick = () => openInstalledApp(app);
        const uninstall = document.createElement('button');
        uninstall.className = 'small-btn';
        uninstall.textContent = 'UNINSTALL';
        uninstall.onclick = () => uninstallApp(app.id);
        container.appendChild(btn);
        container.appendChild(uninstall);
      } else {
        btn.className = 'small-btn';
        btn.textContent = 'GET';
        btn.onclick = () => installApp(app.id, app.icon, app.name, app.bg, app);
        container.appendChild(btn);
      }
    }

    // load more
    function loadMore() {
      storeFilter.page = (storeFilter.page || 1) + 1;
      renderStore();
    }
    function resetStoreFilters() {
      document.getElementById('store-search').value = '';
      storeFilter.category = 'All';
      storeFilter.page = 1;
      renderStore();
    }

    // detail overlay
    function openDetail(id) {
      const app = storeApps.find(a => a.id === id);
      if (!app) return;
      const card = document.getElementById('detail-card');
      card.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">
          <div class="card-icon" style="background:${app.bg}; width:64px; height:64px; font-size:30px; color:${getContrastText(app.bg)}">${app.icon}</div>
          <div style="flex:1;">
            <div style="font-weight:900;font-size:18px">${app.name}</div>
            <div style="color:#666;margin-top:6px">${app.category}</div>
          </div>
        </div>
        <div style="color:#333;margin-bottom:12px">${app.desc} — This is a demo app in the mock store.</div>
        <div style="display:flex;gap:8px; justify-content:flex-end;">
          <button class="small-btn" onclick="installApp('${app.id}','${escapeJs(app.icon)}','${escapeJs(app.name)}','${app.bg}', ${JSON.stringify(app)})">${installed[app.id] ? 'OPEN' : 'GET'}</button>
          <button class="small-btn secondary" onclick="hideDetail()">Close</button>
        </div>
      `;
      document.getElementById('detail-overlay').style.display = 'flex';
    }
    function hideDetail(e) {
      if (e && e.target !== document.getElementById('detail-overlay')) return;
      document.getElementById('detail-overlay').style.display = 'none';
    }

    // install / uninstall logic
    function installApp(id, icon, label, bg, appObj) {
      if (installed[id]) { openInstalledApp(appObj || storeApps.find(s=>s.id===id)); return; }
      // simulate download
      const original = document.querySelector(`#actions-${id} .small-btn`);
      if (original) { original.textContent = 'LOADING...'; original.disabled = true; }
      setTimeout(() => {
        installed[id] = true;
        // add to home
        addToHome(id, icon, label, bg);
        renderStore();
        alert(label + ' installed');
      }, 700);
    }

    function uninstallApp(id) {
      if (!installed[id]) return;
      // remove from home grid icons (first matching)
      const grid = document.getElementById('home-grid');
      const items = Array.from(grid.querySelectorAll('.app'));
      for (let el of items) {
        if (el.dataset && el.dataset.appId === id) {
          grid.removeChild(el);
          break;
        }
      }
      delete installed[id];
      renderStore();
      alert('Uninstalled');
    }

    function addToHome(id, icon, label, bg) {
      const grid = document.getElementById('home-grid');
      const el = document.createElement('div');
      el.className = 'app';
      el.dataset.appId = id;
      el.onclick = () => {
        // open built-in windows if available
        if (id === 'snake') openApp('app-snake', false);
        else if (id === 'paint') openApp('app-paint', true);
        else openGenericApp(id, icon, label, bg);
      };
      el.innerHTML = `<div class="icon" style="background:${bg};">${icon}</div><div class="label">${label}</div>`;
      grid.appendChild(el);
    }

    function openInstalledApp(app) {
      if (!app) app = storeApps.find(a=>installed[a.id]);
      if (!app) return;
      if (app.id === 'snake') openApp('app-snake', false);
      else if (app.id === 'paint') openApp('app-paint', true);
      else openGenericApp(app.id, app.icon, app.name, app.bg);
      hideDetail();
    }

    // generic app creation for demo apps without a custom window
    function openGenericApp(id, icon, label, bg) {
      const container = document.getElementById('app-generic-container');
      container.innerHTML = `
        <div id="app-generic-${id}" class="app-window light active" style="background:${bg}; color:${getContrastText(bg)}; z-index:1000;">
          <div style="padding:16px; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:900">${label}</div>
            <div>
              <button class="btn" style="background:${getContrastText(bg)==='#000' ? '#fff' : '#000'; color:${getContrastText(bg)==='#000' ? '#000' : '#fff'}" onclick="goHome()">Home</button>
            </div>
          </div>
          <div style="padding:12px;">
            <div style="background:rgba(255,255,255,0.85); color:#111; padding:12px; border-radius:8px;">
              <strong>${label}</strong><div style="margin-top:8px">${(storeApps.find(a=>a.id===id)||{}).desc || 'Demo app content'}</div>
            </div>
          </div>
        </div>
      `;
      // hide home area
      document.getElementById('home').style.display = 'none';
      document.querySelector('.status').style.color = getContrastText(bg);
      document.querySelector('.home-indicator').style.background = getContrastText(bg) === '#000' ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.85)';
    }

    // small utility: pick contrasting text for icon background
    function getContrastText(hex) {
      // remove # if present
      if (!hex) return '#000';
      const h = hex.replace('#','');
      const r = parseInt(h.slice(0,2),16);
      const g = parseInt(h.slice(2,4),16);
      const b = parseInt(h.slice(4,6),16);
      // luminance
      const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
      return luminance > 0.6 ? '#000' : '#fff';
    }

    // escape for injecting text into onclick attributes in detail
    function escapeJs(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'\\"'); }

    // --- Paint app
    (function initPaint() {
      const canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';
      let drawing = false;
      let lastX = 0, lastY = 0;

      function pos(e) {
        const r = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return {x,y};
      }
      function start(e) {
        drawing = true;
        const p = pos(e);
        lastX = p.x; lastY = p.y;
      }
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX,lastY);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
      }
      function end() { drawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('touchmove', move, {passive:false});
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchend', end);

      window.clearPaint = function() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      };
      window.clearPaint();
    })();

    // --- Snake game (same as before)
    (function initSnake() {
      const canvas = document.getElementById('snakeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const tile = 16;
      const cols = Math.floor(canvas.width / tile);
      const rows = Math.floor(canvas.height / tile);
      let snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
      let dir = {x:1,y:0};
      let apple = spawnApple();
      let running = false;
      let timer = null;
      const speed = 120;

      function spawnApple() {
        return { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      }

      function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(apple.x*tile, apple.y*tile, tile, tile);
        ctx.fillStyle = '#7ed957';
        snake.forEach((s) => ctx.fillRect(s.x*tile, s.y*tile, tile-1, tile-1));
      }

      function step() {
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0) head.x = cols-1;
        if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows-1;
        if (head.y >= rows) head.y = 0;

        for (let s of snake) { if (s.x === head.x && s.y === head.y) { stopSnake(); alert('Game over! Score: ' + (snake.length-1)); snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}]; dir = {x:1,y:0}; apple = spawnApple(); return; } }
        snake.unshift(head);
        if (head.x === apple.x && head.y === apple.y) apple = spawnApple(); else snake.pop();
      }

      function loop() {
        step();
        draw();
        if (running) timer = setTimeout(loop, speed);
      }

      window.startSnake = function() {
        if (!running) { running = true; loop(); }
      };
      window.stopSnake = function() {
        running = false;
        if (timer) clearTimeout(timer);
        timer = null;
      };

      window.addEventListener('keydown', (e) => {
        if (!document.getElementById('app-snake').classList.contains('active')) return;
        if (e.key === 'ArrowUp' && dir.y !== 1) dir = {x:0,y:-1};
        if (e.key === 'ArrowDown' && dir.y !== -1) dir = {x:0,y:1};
        if (e.key === 'ArrowLeft' && dir.x !== 1) dir = {x:-1,y:0};
        if (e.key === 'ArrowRight' && dir.x !== -1) dir = {x:1,y:0};
      });

      draw();
    })();

    // --- Initialize store and home
    function init() {
      // populate categories and store items
      renderStore();
    }
    init();

    // start on home
    goHome();
  </script>
</body>
</html>
